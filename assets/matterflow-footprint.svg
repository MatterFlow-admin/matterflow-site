<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340"
 role="img" aria-label="MatterFlow's footprint drawn to scale on a one-foot grid: about 24 square feet.">
 <title>Footprint, drawn to scale</title>
 <!-- Scale: 30px = 1 ft. A 24 sq ft square is about 4.9 ft a side (147px). -->
 <g stroke-linecap="square">
  <text x="70" y="52" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2.4" fill="#00E599">FOOTPRINT</text>
  <g stroke="rgba(148,163,184,.16)" stroke-width="1">
   <path d="M70 90V240M100 90V240M130 90V240M160 90V240M190 90V240M220 90V240M250 90V240M280 90V240M310 90V240M340 90V240M370 90V240"/>
   <path d="M70 90H370M70 120H370M70 150H370M70 180H370M70 210H370M70 240H370"/>
  </g>
  <rect x="70" y="93" width="147" height="147" fill="rgba(0,229,153,.22)" stroke="#00E599" stroke-width="2"/>
  <line x1="217" y1="166" x2="400" y2="166" stroke="#00E599" stroke-width="1.4"/>
  <text x="412" y="162" font-family="Inter, sans-serif" font-size="17" font-weight="700" fill="#00E599">MatterFlow</text>
  <text x="412" y="186" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="#00E599">ABOUT 24 SQ FT</text>
  <line x1="70" y1="290" x2="370" y2="290" stroke="rgba(148,163,184,.55)" stroke-width="1.4"/>
  <line x1="70" y1="285" x2="70" y2="295" stroke="rgba(148,163,184,.55)" stroke-width="1.4"/>
  <line x1="370" y1="285" x2="370" y2="295" stroke="rgba(148,163,184,.55)" stroke-width="1.4"/>
  <text x="384" y="294" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="2" fill="rgba(148,163,184,.7)">10 FT · DRAWN TO SCALE · 1 FT GRID</text>
 </g>
</svg>
