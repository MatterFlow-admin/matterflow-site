<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620"
 role="img" aria-label="Footprint comparison drawn to scale. A typical venue back-of-house waste area is 1,200 square feet or less. Conventional sorting systems need more space than that room provides. MatterFlow occupies 24 square feet.">
 <title>Footprint, drawn to scale</title><g stroke-linecap="square"><text x="70" y="52" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2.4" fill="#00E599">FOOTPRINT</text><rect x="70" y="96" width="440" height="440" fill="none" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 6"/><text x="532" y="114" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#94A3B8">Conventional</text><text x="532" y="134" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#94A3B8">systems</text><text x="532" y="158" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="rgba(148,163,184,.55)">LARGER THAN</text><text x="532" y="176" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="rgba(148,163,184,.55)">THE ROOM</text><rect x="70" y="154.94882233484697" width="381" height="381" fill="rgba(148,163,184,.05)" stroke="rgba(148,163,184,.28)" stroke-width="1.6"/><text x="88" y="186.94882233484697" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#DCE6F2">Typical back-of-house area</text><text x="88" y="208.94882233484697" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="rgba(148,163,184,.55)">1,200 SQ FT OR LESS</text><rect x="96" y="456" width="54" height="54" fill="rgba(0,229,153,.22)" stroke="#00E599" stroke-width="2"/><line x1="150" y1="483" x2="170" y2="483" stroke="#00E599" stroke-width="1.4"/><text x="180" y="480" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#00E599">MatterFlow</text><text x="180" y="502" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="#00E599">24 SQ FT</text><line x1="70" y1="586" x2="180" y2="586" stroke="rgba(148,163,184,.55)" stroke-width="1.4"/><line x1="70" y1="581" x2="70" y2="591" stroke="rgba(148,163,184,.55)" stroke-width="1.4"/><line x1="180" y1="581" x2="180" y2="591" stroke="rgba(148,163,184,.55)" stroke-width="1.4"/><text x="194" y="590" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="2" fill="rgba(148,163,184,.55)">10 FT · DRAWN TO SCALE</text></g></svg>